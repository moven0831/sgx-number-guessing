services:
  sgx-scaffold-builder:
    image: ghcr.io/automata-network/sgx-scaffold:ubuntu-22.04_sgx-2.24
    build:
      context: ./../../
      dockerfile: ./docker/ubuntu-22.04/Dockerfile

  sgx-scaffold:
    image: ghcr.io/automata-network/sgx-scaffold:ubuntu-22.04_sgx-2.24
    ports:
      - "127.0.0.1:8080:8080"
    container_name: sgx-scaffold
    privileged: true
    environment:
      - AZDCAP_BYPASS_BASE_URL=${AZDCAP_BYPASS_BASE_URL:-true}
      - AZDCAP_DEBUG_LOG_LEVEL=${AZDCAP_DEBUG_LOG_LEVEL:-ERROR1}
    volumes:
      - /dev/sgx_provision:/dev/sgx_provision
      - /dev/sgx:/dev/sgx
      - /dev/sgx_enclave:/dev/sgx_enclave
    working_dir: /workspace
